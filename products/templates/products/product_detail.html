
    <title>Product Detail</title>

    {%block content%}

   
    <div>
       <ul>
        <h1>{{ product.name }}</h1>
        <!--img src="{{ product.image.url }}" alt="{{ product.name }}"-->
        
        <p>Price: {{product.price}}</p>

        <p>{{ product.category.name }}</p>

        {%if product.description%}
            <p>{{product.description}}</p>
         {%endif%}

        <button>Add to Cart</button>
        </ul>
       
    </div> 
    
    
    {%endblock%}
